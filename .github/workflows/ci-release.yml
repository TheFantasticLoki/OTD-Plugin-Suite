name: SpatialAim CI and Release

on:
  push:
    branches:
      - Dev
      - Release
      - dev
      - release
      - main
    tags:
      - v*
  pull_request:
    branches:
      - Dev
      - Release
      - dev
      - release
      - main
  workflow_dispatch:

concurrency:
  group: spatial-aim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SpatialAim.Filters.sln

      - name: Test and package all locales
        run: bash scripts/build-locales.sh --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialAim-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source and release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release-branch ancestry
        run: |
          git fetch origin --prune
          for release_ref in refs/remotes/origin/Release refs/remotes/origin/release; do
            if git show-ref --verify --quiet "$release_ref" &&
               git merge-base --is-ancestor "$GITHUB_SHA" "$release_ref"; then
              echo "Tag commit is contained in $release_ref."
              exit 0
            fi
          done
          echo "Release tags must point to a commit on origin/Release or origin/release."
          exit 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: SpatialAim-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Generate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum artifacts/SpatialAim.Filters.zip | cut -d ' ' -f 1 > artifacts/SHA256.txt
          (cd artifacts && sha256sum SpatialAim.Filters*.zip > SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          archive = Path("artifacts/SpatialAim.Filters.zip")
          metadata = json.loads(Path("plugin-metadata.template.json").read_text())
          metadata["PluginVersion"] = version
          metadata["DownloadUrl"] = f"{metadata['RepositoryUrl']}/releases/download/{tag}/{archive.name}"
          metadata["SHA256"] = Path("artifacts/SHA256.txt").read_text().strip()
          Path("artifacts/SpatialAim.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/SpatialAim.Filters*.zip
          artifacts/SpatialAim.json
          artifacts/SHA256.txt
          artifacts/SHA256SUMS.txt
          --title "SpatialAim $GITHUB_REF_NAME"
          --generate-notes