name: SpatialAim CI and Release

on:
  push:
    branches:
      - dev
      - release
    tags:
      - v*
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch:

concurrency:
  group: spatial-aim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SpatialAim.Filters.sln

      - name: Test
        run: dotnet test SpatialAim.Filters.sln --configuration Release --no-restore

      - name: Build
        run: dotnet build SpatialAim.Filters.sln --configuration Release --no-restore

      - name: Package plugin
        run: |
          mkdir -p artifacts/plugin
          cp src/SpatialAim.Filters/bin/Release/net8.0/SpatialAim.Filters.dll artifacts/plugin/
          (cd artifacts/plugin && zip -q ../SpatialAim.Filters.zip SpatialAim.Filters.dll)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialAim-${{ github.sha }}
          path: artifacts/SpatialAim.Filters.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source and release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release-branch ancestry
        run: |
          git fetch origin release:refs/remotes/origin/release
          git merge-base --is-ancestor "$GITHUB_SHA" origin/release || {
            echo "Release tags must point to a commit on the release branch."
            exit 1
          }

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: SpatialAim-${{ github.sha }}
          path: artifacts

      - name: Generate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum artifacts/SpatialAim.Filters.zip | cut -d ' ' -f 1 > artifacts/SHA256.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          archive = Path("artifacts/SpatialAim.Filters.zip")
          metadata = json.loads(Path("plugin-metadata.template.json").read_text())
          metadata["PluginVersion"] = version
          metadata["DownloadUrl"] = f"{metadata['RepositoryUrl']}/releases/download/{tag}/{archive.name}"
          metadata["SHA256"] = Path("artifacts/SHA256.txt").read_text().strip()
          Path("artifacts/SpatialAim.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/SpatialAim.Filters.zip
          artifacts/SpatialAim.json
          artifacts/SHA256.txt
          --title "SpatialAim $GITHUB_REF_NAME"
          --generate-notes